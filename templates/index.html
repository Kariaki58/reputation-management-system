<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Feedback</title>
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <div class="logo-circle">
                <img src="static/images/logo.png" alt="Business Logo">
            </div>
            <h1 class="business-name">Your Business</h1>
        </div>
        <!-- Initial Rating Screen -->
        <div class="rating-screen" id="ratingScreen">
            <h1>How would you rate your experience?</h1>
            <div class="rating-stars">
                <i class="far fa-star" data-rating="1"></i>
                <i class="far fa-star" data-rating="2"></i>
                <i class="far fa-star" data-rating="3"></i>
                <i class="far fa-star" data-rating="4"></i>
                <i class="far fa-star" data-rating="5"></i>
            </div>
            <button id="continue-btn" class="submit-btn" disabled>Continue</button>
        </div>

        <!-- Low Rating Form (1-3 stars) -->
        <div class="feedback-form hidden" id="lowRatingForm">
            <h2>Help us improve</h2>
            <form id="detailedFeedbackForm">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Your Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="feedback">What could we do better?</label>
                    <textarea id="feedback" rows="5" required></textarea>
                </div>
                <button type="submit" class="submit-btn">Submit Feedback</button>
                <!-- In lowRatingForm div -->
                <button id="back-to-rating" class="back-btn">← Back to Rating</button>
            </form>
        </div>

        <!-- Thank You Message -->
        <div class="thank-you-message hidden" id="thankYouMessage">
            <h2>Thank You!</h2>
            <p id="followupMessage"></p>
            <!-- In thankYouMessage div -->
            <button id="new-review" class="back-btn">Leave Another Review</button>
        </div>
    </div>

    <script src="static/js/script.js"></script>
</body>
</html>
